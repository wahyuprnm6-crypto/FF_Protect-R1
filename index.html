    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Proteksi window.fetch jika environment/ekstensi mencoba menimpa window.fetch saat hanya memiliki getter
      try {
        if (typeof window !== 'undefined') {
          const originalFetch = window.fetch;
          let currentFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return currentFetch;
            },
            set: function(fn) {
              currentFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        }
      } catch (e) {
        console.warn('Polyfill window.fetch setter:', e);
      }
    </script>
